name: android

permissions:
  contents: write

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.41.6"
  VERSION: "1.0.0-luogen.12"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze || true

      - name: Build APK
        run: |
          flutter build apk --release --split-per-abi --build-name "${VERSION}" --build-number ${{ github.run_number }}

      - name: Rename
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/LogenAudioStudio-v${VERSION}.apk" 2>/dev/null || true
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "dist/LogenAudioStudio-v${VERSION}.apk"
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: logen-audio-apk
          path: dist/*.apk
          retention-days: 30

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${VERSION}" "dist/LogenAudioStudio-v${VERSION}.apk" \
            --title "罗根音频工作室 v${VERSION}" \
            --notes "作者：罗根（Logen）" || \
          gh release upload "v${VERSION}" "dist/LogenAudioStudio-v${VERSION}.apk" --clobber
