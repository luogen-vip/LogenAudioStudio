name: Model Host
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Download model
        run: |
          curl -fL --retry 3 -o UVR-MDX-NET-Voc_FT.onnx \
            https://huggingface.co/aaatmy/uvr-mdx-net-onnx/resolve/main/UVR-MDX-NET-Voc_FT.onnx
          ls -lh UVR-MDX-NET-Voc_FT.onnx

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v1.0.0-luogen.9 UVR-MDX-NET-Voc_FT.onnx --clobber --repo luogen-vip/LogenAudioStudio
