name: Model Host
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Download model
        run: |
          curl -fL --retry 3 -o htdemucs_fp16weights.onnx \
            https://huggingface.co/StemSplitio/htdemucs-onnx/resolve/main/htdemucs_fp16weights.onnx
          ls -lh htdemucs_fp16weights.onnx

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v1.0.0-luogen.9 htdemucs_fp16weights.onnx --clobber --repo luogen-vip/LogenAudioStudio
